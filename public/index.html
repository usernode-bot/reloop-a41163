  <script>
  // usernode-dev-console@1
  (function () {
    if (window.__usernodeDevConsole) return;
    window.__usernodeDevConsole = true;
    var S = '__usernodeDevConsole';
    function serialize(v, depth) {
      depth = depth || 0;
      try {
        if (v === undefined) return 'undefined';
        if (v === null) return 'null';
        if (typeof v === 'string') return v;
        if (typeof v === 'number' || typeof v === 'boolean') return String(v);
        if (typeof v === 'function') return '[Function ' + (v.name || 'anonymous') + ']';
        if (v instanceof Error) return (v.stack || (v.name + ': ' + v.message));
        if (depth > 3) return '[…]';
        var seen = new WeakSet();
        return JSON.stringify(v, function (k, val) {
          if (typeof val === 'object' && val !== null) {
            if (seen.has(val)) return '[Circular]';
            seen.add(val);
          }
          if (typeof val === 'function') return '[Function ' + (val.name || 'anonymous') + ']';
          if (val instanceof Error) return val.stack || (val.name + ': ' + val.message);
          return val;
        });
      } catch (e) { try { return String(v); } catch (_) { return '[unserializable]'; } }
    }
    function post(level, args, meta) {
      try {
        var payload = {
          sentinel: S,
          level: level,
          args: Array.prototype.slice.call(args).map(function (a) { return serialize(a); }),
          ts: Date.now(),
          url: location.href,
        };
        if (meta) for (var k in meta) payload[k] = meta[k];
        if (window.parent && window.parent !== window) {
          window.parent.postMessage(payload, '*');
        }
      } catch (_) {}
    }
    ['log','info','warn','error','debug'].forEach(function (level) {
      var orig = console[level] ? console[level].bind(console) : function () {};
      console[level] = function () { post(level, arguments); orig.apply(null, arguments); };
    });
    window.addEventListener('error', function (e) {
      var msg = (e.error && (e.error.stack || e.error.message)) || e.message || 'Error';
      post('error', [msg], { source: e.filename || '', line: e.lineno || 0, col: e.colno || 0, kind: 'error' });
    });
    window.addEventListener('unhandledrejection', function (e) {
      var r = e.reason;
      var msg = (r && (r.stack || r.message)) || String(r);
      post('error', [msg], { kind: 'unhandledrejection' });
    });
    try { post('info', ['[dev-console ready]'], { kind: 'ready' }); } catch (_) {}
  })();
  </script>
  <title>ReLoop: Give. Swap. Reuse.</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%230f766e'/><path d='M30 40a22 22 0 0 1 40 0' stroke='white' stroke-width='9' fill='none' stroke-linecap='round'/><path d='M70 60a22 22 0 0 1-40 0' stroke='white' stroke-width='9' fill='none' stroke-linecap='round'/></svg>">
  <!-- Tailwind, PRECOMPILED for this app. The config moved to
       tailwind.config.js in the repo root; npm run build compiles it to
       public/tailwind.css with Docker or Paketo on every image build, so the
       stylesheet is regenerated from THIS commit's markup every deploy and
       can never drift behind the code.
       Writing class names as whole literals is what keeps this working — a
       class assembled from fragments at runtime is invisible to the
       compiler. -->
  <link rel="stylesheet" href="/tailwind.css">
  <!-- The platform bridge, centrally hosted and loaded by RELATIVE path (the
       handler in server.js serves it under a plain "node server.js"; the
       platform's edge answers it everywhere else). Never vendor it and never
       write a hostname in front of it.
       It is NOT conditional on this app calling a bridge API: it is also how
       the app ANSWERS the shell, so a scaffold without it is invisible to
       anything that asks the frame a question. Offline launch is one of those.
       Another is the page's colour: the bridge reports this document's opaque
       ground to the shell (#1581), which is what makes the platform bar above
       the app take the app's tone instead of the viewer's theme (#1945).
       The bridge is also where the app learns the viewer's light/dark theme:
       the script below reads it. -->
  <script src="/usernode-bridge/v1/bridge.js"></script>
  <!-- Follow the viewer's Homeroom theme (the bridge reports it). ReLoop is
       designed dark first, so outside Homeroom, with no theme reported, it
       opens dark. -->
  <script>
    (function () {
      var media = window.matchMedia('(prefers-color-scheme: dark)');
      function applyTheme() {
        var theme = (window.usernode && window.usernode.theme) || 'dark';
        document.documentElement.classList.toggle('dark', theme === 'dark');
        document.documentElement.style.colorScheme = theme;
      }
      applyTheme();
      window.addEventListener('usernode:theme-changed', applyTheme);
      media.addEventListener('change', applyTheme);
    })();
  </script>
</head>
<body class="min-h-screen bg-ground text-fg">
  <main id="app" class="mx-auto flex min-h-screen max-w-md flex-col px-4 pb-28 pt-6"></main>

  <!-- The bottom tab bar. Buttons are 44 px+ targets; the active tab takes
       the accent colour. The Moderate tab appears only for moderators.
       Posting is a button on Home, not a tab. -->
  <nav class="tab-nav" aria-label="Main">
    <div id="tabbar" class="mx-auto flex max-w-md"></div>
  </nav>

  <script>
  (function () {
    'use strict';

    // ── Platform plumbing ──────────────────────────────────────────────────
    // The iframe adds ?token=… on load; forward it on every fetch.
    const params = new URLSearchParams(window.location.search);
    const TOKEN = params.get('token') || '';
    const HEADERS = Object.assign(
      { 'Content-Type': 'application/json' },
      TOKEN ? { 'x-usernode-token': TOKEN } : {}
    );

    async function api(path, opts) {
      // A staging preview opened as of another moment tells the server
      // that moment, so anything time-based matches what the page shows.
      const headers = window.usernode && window.usernode.previewNow
        ? Object.assign({ 'x-usernode-now': window.usernode.now().toISOString() }, HEADERS)
        : HEADERS;
      const res = await fetch(path, Object.assign({ headers: headers }, opts || {}));
      let data = null;
      try { data = await res.json(); } catch (_) {}
      if (!res.ok) {
        const err = new Error((data && data.error) || ('HTTP ' + res.status));
        err.status = res.status;
        err.code = data && data.error;
        err.data = data;
        throw err;
      }
      return data;
    }

    // ── Tiny DOM helpers ───────────────────────────────────────────────────
    // Everything renders through textContent — titles, descriptions and
    // messages are other people's input and never become HTML.
    function el(tag, cls, text) {
      const e = document.createElement(tag);
      if (cls) e.className = cls;
      if (text !== undefined && text !== null) e.textContent = text;
      return e;
    }

    function icon(paths, cls) {
      const NS = 'http://www.w3.org/2000/svg';
      const svg = document.createElementNS(NS, 'svg');
      svg.setAttribute('viewBox', '0 0 24 24');
      svg.setAttribute('fill', 'none');
      svg.setAttribute('stroke', 'currentColor');
      svg.setAttribute('stroke-width', '1.8');
      svg.setAttribute('stroke-linecap', 'round');
      svg.setAttribute('stroke-linejoin', 'round');
      svg.setAttribute('aria-hidden', 'true');
      if (cls) svg.setAttribute('class', cls);
      for (const d of [].concat(paths)) {
        const p = document.createElementNS(NS, 'path');
        p.setAttribute('d', d);
        svg.appendChild(p);
      }
      return svg;
    }

    const ICONS = {
      home: ['M3 10.5 12 3l9 7.5', 'M5 9.5V21h14V9.5'],
      loop: ['M17 2l4 4-4 4', 'M3 11v-1a4 4 0 0 1 4-4h14', 'M7 22l-4-4 4-4', 'M21 13v1a4 4 0 0 1-4 4H3'],
      impact: ['M4 20V10', 'M10 20V4', 'M16 20v-7', 'M22 20H2'],
      profile: ['M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z', 'M5 21a7 7 0 0 1 14 0'],
      moderate: ['M12 3l7 3v5c0 4.5-3 8.5-7 10-4-1.5-7-5.5-7-10V6l7-3Z'],
      chevron: ['M9 6l6 6-6 6'],
      alert: ['M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18Z', 'M12 8v5', 'M12 16h.01'],
      camera: ['M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1Z', 'M12 17a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z'],
    };

    // ── App state ──────────────────────────────────────────────────────────
    const state = {
      guest: false,
      member: null,       // the signed-in member row (null for guests)
      setupConfigured: false,
      isAdmin: false,
      areas: [],
      categories: [],
      conditions: [],
      estGrams: {},
      // Home filters and the My Loops tab survive a re-render.
      filterCategory: '',
      filterType: '',
      loopsTab: 'items',
      modTab: 'reports',
    };

    let mePromise = null;
    function loadMe(force) {
      if (!mePromise || force) {
        mePromise = api('/api/me').then(d => {
          state.guest = !!d.guest;
          state.member = d.member || null;
          state.setupConfigured = !!d.setup_configured;
          state.isAdmin = !!(d.member && d.member.is_admin);
          state.areas = d.areas || [];
          state.categories = d.categories || [];
          state.conditions = d.conditions || [];
          state.estGrams = d.est_grams || {};
        }).catch(() => { state.guest = true; state.member = null; state.isAdmin = false; });
      }
      return mePromise;
    }

    // ── Words and formatting ───────────────────────────────────────────────
    const CATEGORY_LABEL = { clothes: 'Clothes', electronics: 'Electronics', furniture: 'Furniture', books: 'Books', kitchen: 'Kitchen' };
    const CONDITION_LABEL = { like_new: 'Like new', good: 'Good', worn: 'Worn' };
    const STATUS_LABEL = { available: 'Available', reserved: 'Reserved', done: 'Done' };
    const REQUEST_LABEL = { pending: 'Waiting for a reply', accepted: 'Accepted', declined: 'Declined', cancelled: 'Cancelled' };
    const REPORT_REASONS = [
      ['not_secondhand', 'Not a second-hand item'],
      ['inappropriate', 'Inappropriate photo or text'],
      ['spam', 'Spam'],
      ['other', 'Other'],
    ];

    function fmt(n) { return Number(n).toLocaleString('en-US'); }
    function priceLabel(item) {
      if (item.listing_type === 'free') return 'Free';
      if (item.listing_type === 'swap') return 'Swap';
      return 'Rp ' + fmt(item.price_idr);
    }
    // Whole kilograms, one decimal under 10 kg. Always an estimate.
    function kgLabel(g) {
      const k = g / 1000;
      const v = k < 10 ? Math.round(k * 10) / 10 : Math.round(k);
      return v.toLocaleString('en-US') + ' kg';
    }
    function displayName() {
      return (state.member && (state.member.display_name || state.member.username)) || 'Member';
    }
    function viewerArea() {
      return (state.member && state.member.pickup_area) || '';
    }
    function blocksFrom(area) {
      const mine = viewerArea();
      if (!mine) return null;
      const a = state.areas.indexOf(area);
      const b = state.areas.indexOf(mine);
      if (a === -1 || b === -1) return null;
      return Math.abs(a - b);
    }
    function distanceLabel(n) {
      if (n === null) return '';
      if (n === 0) return 'In your area';
      return n + (n === 1 ? ' block away' : ' blocks away');
    }
    function fmtDate(iso) {
      return new Date(iso).toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' });
    }
    function thumbUrl(item) {
      return item.photo_url || '/art/' + (CATEGORY_LABEL[item.category] ? item.category : 'kitchen') + '.svg';
    }

    // ── Shared parts ───────────────────────────────────────────────────────
    function badge(text) {
      return el('span', 'rounded-full bg-raised px-2 py-0.5 text-small text-muted', text);
    }
    function banner(text, isError) {
      return el('div', 'rounded-lg border px-4 py-3 text-small ' +
        (isError ? 'border-danger/40 text-danger' : 'border-line bg-raised text-fg'), text);
    }
    function fieldRow(labelText, input) {
      const wrap = el('label', 'flex flex-col gap-1');
      wrap.append(el('span', 'px-1 text-small font-medium text-muted', labelText), input);
      return wrap;
    }
    function textField() { const i = el('input', 'field'); i.type = 'text'; return i; }
    function selectField(options, value) {
      const s = el('select', 'field');
      for (const o of options) {
        const opt = el('option', '', o[1]);
        opt.value = o[0];
        s.append(opt);
      }
      s.value = value || '';
      return s;
    }
    // A filter / choice chip. 44 px, rounded, accent when pressed.
    function chip(text, pressed, onClick) {
      const b = el('button', 'chip', text);
      b.type = 'button';
      b.setAttribute('aria-pressed', pressed ? 'true' : 'false');
      b.addEventListener('click', onClick);
      return b;
    }
    function segmented(options, current, onPick) {
      const wrap = el('div', 'flex overflow-hidden rounded-lg border border-line');
      for (const [id, label] of options) {
        const b = el('button', 'min-h-11 flex-1 px-3 text-small font-medium ' +
          (id === current ? 'bg-accent text-on-accent' : 'bg-surface text-muted'));
        b.type = 'button';
        b.setAttribute('aria-pressed', id === current ? 'true' : 'false');
        b.textContent = label;
        b.addEventListener('click', () => onPick(id));
        wrap.append(b);
      }
      return wrap;
    }
    function photo(url, category, cls, alt) {
      const img = el('img', cls);
      img.alt = alt || '';
      img.loading = 'lazy';
      const fallback = '/art/' + (CATEGORY_LABEL[category] ? category : 'kitchen') + '.svg';
      let fellBack = false;
      img.addEventListener('error', () => {
        if (fellBack) return;
        fellBack = true;
        img.src = fallback;
      });
      img.src = url || fallback;
      return img;
    }
    function pageError(title, body, actionLabel, action) {
      const wrap = el('div', 'state-error');
      wrap.append(
        icon(ICONS.alert, 'h-6 w-6 text-danger'),
        el('p', 'text-heading', title),
        el('p', 'text-body text-muted', body)
      );
      if (actionLabel) {
        const b = el('button', 'btn-secondary', actionLabel);
        b.type = 'button';
        b.addEventListener('click', action);
        wrap.append(b);
      }
      return wrap;
    }

    // ── The four states of anything that loads data ────────────────────────
    // Exactly one of loading / data / empty / error shows at a time. Empty
    // only when the load worked and found nothing; a failure is the error
    // state, never "nothing yet".
    function makeStates(host, opts) {
      opts = opts || {};
      const loading = el('div', 'list');
      loading.setAttribute('role', 'status');
      loading.append(el('span', 'sr-only', opts.loadingText || 'Loading'));
      for (const w of ['w-1/2', 'w-1/3', 'w-2/5']) {
        const r = el('div', 'list-row');
        r.append(el('div', 'skeleton h-4 ' + w));
        loading.append(r);
      }
      const listEl = el('ul', 'list');
      const emptyEl = el('div', 'state-empty');
      const errorEl = el('div', 'state-error');
      const retryBtn = el('button', 'btn-secondary', 'Retry');
      retryBtn.type = 'button';
      errorEl.append(
        icon(ICONS.alert, 'h-6 w-6 text-danger'),
        el('p', 'text-heading', opts.errorTitle || "Couldn't load this"),
        el('p', 'text-body text-muted', opts.errorBody || 'Check your connection and try again.'),
        retryBtn
      );
      const parts = [loading, listEl, emptyEl, errorEl];
      for (const p of parts) host.append(p);
      const api2 = {
        show(name) {
          for (const p of parts) p.hidden = true;
          ({ loading: loading, list: listEl, empty: emptyEl, error: errorEl })[name].hidden = false;
        },
        setEmpty(title, body, extraNode) {
          emptyEl.replaceChildren(
            el('p', 'text-heading', title),
            el('p', 'text-body text-muted', body)
          );
          if (extraNode) emptyEl.append(extraNode);
        },
        listEl: listEl,
        retry: null,
      };
      retryBtn.addEventListener('click', () => { api2.show('loading'); if (api2.retry) api2.retry(); });
      api2.show('loading');
      return api2;
    }

    // ── Router + tab bar ───────────────────────────────────────────────────
    const appRoot = document.getElementById('app');
    const tabbar = document.getElementById('tabbar');
    const TABS = [
      { id: 'home', label: 'Home', icon: ICONS.home },
      { id: 'loops', label: 'My Loops', icon: ICONS.loop },
      { id: 'impact', label: 'Impact', icon: ICONS.impact },
      { id: 'profile', label: 'Profile', icon: ICONS.profile },
      { id: 'moderate', label: 'Moderate', icon: ICONS.moderate },
    ];
    const routes = {};
    let routeName = 'home';
    let routeParam = null;

    function currentRoute() {
      const h = window.location.hash.replace(/^#\/?/, '');
      const m = /^item\/([^/]+)$/.exec(h);
      if (m) { routeName = 'item'; routeParam = decodeURIComponent(m[1]); return routeName; }
      routeName = routes[h] ? h : 'home';
      routeParam = null;
      return routeName;
    }

    function renderTabbar(current) {
      tabbar.replaceChildren(...TABS
        .filter(t => t.id !== 'moderate' || state.isAdmin)
        .map(t => {
          const b = el('button', 'tab-btn');
          b.type = 'button';
          if (t.id === current) b.setAttribute('aria-current', 'page');
          b.append(icon(t.icon, 'h-5 w-5'), el('span', '', t.label));
          b.addEventListener('click', () => { window.location.hash = '#/' + t.id; });
          return b;
        }));
    }

    let routeEpoch = 0;
    function route() {
      const name = currentRoute();
      const param = routeParam;
      renderTabbar(name);
      const epoch = ++routeEpoch;
      Promise.resolve(routes[name](param)).then(root => {
        if (epoch === routeEpoch) appRoot.replaceChildren(root);
      }).catch(e => {
        console.error(String(e && e.stack || e));
        if (epoch === routeEpoch) appRoot.replaceChildren(
          pageError('Something went wrong', 'Reload the app and try again.', 'Home', () => go('home'))
        );
      });
      window.scrollTo(0, 0);
    }
    window.addEventListener('hashchange', route);

    function go(name, param) {
      const target = '#/' + name + (param ? '/' + param : '');
      if (window.location.hash === target) route();
      else window.location.hash = target;
    }

    // ── Home: the nearby-items feed ────────────────────────────────────────
    function itemCard(item) {
      const btn = el('button', 'card block w-full overflow-hidden p-0 text-left');
      btn.type = 'button';
      const photoWrap = el('div', 'relative');
      photoWrap.append(photo(item.photo_url, item.category, 'aspect-square w-full object-cover bg-raised', item.title));
      photoWrap.append(el('span', 'absolute left-2 top-2 rounded-full bg-ground px-2 py-0.5 text-small text-fg', priceLabel(item)));
      const body = el('div', 'flex flex-col gap-0.5 p-3');
      body.append(
        el('p', 'line-clamp-2 text-body font-medium', item.title),
        el('p', 'text-small text-muted', CONDITION_LABEL[item.condition] + ' · ' + item.area)
      );
      const dist = distanceLabel(blocksFrom(item.area));
      if (dist) body.append(el('p', 'text-small text-muted', dist));
      btn.append(photoWrap, body);
      btn.addEventListener('click', () => go('item', String(item.id)));
      return btn;
    }

    routes.home = async function homeView() {
      await loadMe(true);
      renderTabbar('home');

      const root = el('section', 'flex flex-col gap-4');
      const head = el('div');
      head.append(
        el('h1', 'text-title', 'ReLoop'),
        el('p', 'text-body text-muted', 'Give, swap or sell what you no longer use.')
      );
      root.append(head);

      const postBtn = el('button', 'btn-primary w-full', 'Post an item');
      postBtn.type = 'button';
      postBtn.addEventListener('click', () => go('post'));
      root.append(postBtn);

      if (state.member && !viewerArea()) {
        const hint = el('button', 'min-h-11 px-1 text-left text-small text-muted', "Set your pickup area in Profile to see what's closest.");
        hint.type = 'button';
        hint.addEventListener('click', () => go('profile'));
        root.append(hint);
      }

      const filters = el('div', 'flex flex-col gap-2');
      const catRow = el('div', 'flex gap-2 overflow-x-auto');
      const typeRow = el('div', 'flex gap-2 overflow-x-auto');
      filters.append(catRow, typeRow);
      root.append(filters);

      const host = el('div');
      root.append(host);
      const st = makeStates(host, {
        errorTitle: "Couldn't load nearby items",
        errorBody: 'The rest of Home still works. Check your connection and try again.',
        loadingText: 'Loading nearby items',
      });
      st.retry = load;

      function drawFilters() {
        catRow.replaceChildren(...[['', 'All']].concat(state.categories.map(c => [c, CATEGORY_LABEL[c]]))
          .map(([v, l]) => chip(l, state.filterCategory === v, () => {
            state.filterCategory = v;
            drawFilters();
            load();
          })));
        typeRow.replaceChildren(...[['', 'All types'], ['free', 'Free'], ['swap', 'Swap'], ['cheap', 'Cheap']]
          .map(([v, l]) => chip(l, state.filterType === v, () => {
            state.filterType = v;
            drawFilters();
            load();
          })));
      }

      function clearFilters() {
        state.filterCategory = '';
        state.filterType = '';
        drawFilters();
        load();
      }

      async function load() {
        st.show('loading');
        const qs = new URLSearchParams();
        if (state.filterCategory) qs.set('category', state.filterCategory);
        if (state.filterType) qs.set('type', state.filterType);
        try {
          const d = await api('/api/items' + (qs.toString() ? '?' + qs.toString() : ''));
          if (!d.items.length) {
            const filtered = !!(state.filterCategory || state.filterType);
            if (filtered) {
              const b = el('button', 'btn-secondary', 'Clear filters');
              b.type = 'button';
              b.addEventListener('click', clearFilters);
              st.setEmpty('Nothing matches these filters', 'Try another category or type.', b);
            } else {
              const b = el('button', 'btn-primary', 'Post an item');
              b.type = 'button';
              b.addEventListener('click', () => go('post'));
              st.setEmpty('No items nearby yet', 'Be the first to post something a neighbor can use.', b);
            }
            st.show('empty');
            return;
          }
          // Closest first; newest breaks a tie.
          const items = d.items.slice().sort((a, b) => {
            const ba = blocksFrom(a.area);
            const bb = blocksFrom(b.area);
            if (ba !== null && bb !== null && ba !== bb) return ba - bb;
            return new Date(b.created_at) - new Date(a.created_at) || b.id - a.id;
          });
          st.listEl.className = 'grid grid-cols-2 gap-3';
          st.listEl.replaceChildren(...items.map(it => {
            const li = el('li');
            li.append(itemCard(it));
            return li;
          }));
          st.show('list');
        } catch (e) { console.error(String(e && e.stack || e)); st.show('error'); }
      }

      drawFilters();
      await load();
      return root;
    };

    // ── Post an item ───────────────────────────────────────────────────────
    routes.post = async function postView() {
      await loadMe(true);
      renderTabbar('home');
      const root = el('section', 'flex flex-col gap-4');
      root.append(el('h1', 'text-title', 'Post an item'));

      if (state.guest || !state.member) {
        const c = el('div', 'card flex flex-col gap-2');
        c.append(
          el('p', 'text-heading', 'Make an account to post an item'),
          el('p', 'text-body text-muted', 'Sign in with Homeroom to give, swap or sell things to your neighbors.')
        );
        root.append(c);
        return root;
      }

      const note = el('div');
      const form = el('form', 'flex flex-col gap-4');
      const photos = [];
      let uploading = 0;
      let condition = 'good';
      let category = state.categories[0] || 'clothes';
      let listingType = 'free';
      let submit;

      // Photos: up to 3, shrunk client-side and uploaded through the bridge.
      const photosBox = el('div', 'flex flex-col gap-1');
      const photoRow = el('div', 'flex gap-2');
      photosBox.append(el('span', 'px-1 text-small font-medium text-muted', 'Photos (up to 3)'), photoRow);

      const titleIn = textField();
      titleIn.maxLength = 80;
      titleIn.placeholder = "Kids' bicycle";
      const descIn = el('textarea', 'field min-h-24');
      descIn.maxLength = 300;
      descIn.placeholder = 'Small scratches, tires hold air.';

      const condRow = el('div', 'flex flex-wrap gap-2');
      const catIn = selectField(state.categories.map(c => [c, CATEGORY_LABEL[c]]), category);
      const areaIn = selectField(state.areas.map(a => [a, a]), state.member.pickup_area || state.areas[0] || '');
      const catRow = el('div', 'grid grid-cols-2 gap-3');
      catRow.append(fieldRow('Category', catIn), fieldRow('Pickup area', areaIn));

      const typeRow = el('div', 'flex gap-2');
      const priceWrap = el('div');
      const priceIn = el('input', 'field');
      priceIn.type = 'number';
      priceIn.min = '1000';
      priceIn.max = '1000000';
      priceIn.step = '1000';
      priceIn.placeholder = '75000';
      priceWrap.append(fieldRow('Price (Rp, paid at pickup)', priceIn));
      priceWrap.hidden = true;

      function drawChips() {
        condRow.replaceChildren(...state.conditions.map(c =>
          chip(CONDITION_LABEL[c], condition === c, () => { condition = c; drawChips(); update(); })));
        typeRow.replaceChildren(...[['free', 'Free'], ['swap', 'Swap'], ['price', 'Price']]
          .map(([v, l]) => chip(l, listingType === v, () => {
            listingType = v;
            drawChips();
            priceWrap.hidden = listingType !== 'price';
            update();
          })));
      }

      function imageFallback() {
        const b = el('div', 'flex h-24 w-24 items-center justify-center rounded-lg bg-raised');
        b.append(icon(ICONS.camera, 'h-6 w-6 text-muted'));
        return b;
      }

      function drawPhotos() {
        photoRow.replaceChildren();
        for (const p of photos) {
          const slot = el('div', 'relative h-24 w-24 shrink-0');
          const img = el('img', 'h-24 w-24 rounded-lg object-cover');
          img.alt = '';
          img.src = p.url;
          const rm = el('button', 'absolute right-1 top-1 flex h-11 w-11 items-center justify-center rounded-full bg-ground/90 text-body text-fg');
          rm.type = 'button';
          rm.setAttribute('aria-label', 'Remove photo');
          rm.textContent = '✕';
          rm.addEventListener('click', () => {
            const i = photos.indexOf(p);
            if (i !== -1) photos.splice(i, 1);
            if (window.usernode && typeof window.usernode.deleteFile === 'function') {
              window.usernode.deleteFile(p.id).catch(() => {});
            }
            drawPhotos();
          });
          slot.append(img, rm);
          photoRow.append(slot);
        }
        for (let i = 0; i < uploading; i++) photoRow.append(el('div', 'skeleton h-24 w-24 shrink-0'));
        if (photos.length + uploading < 3) {
          const lab = el('label', 'flex h-24 w-24 shrink-0 cursor-pointer flex-col items-center justify-center gap-1 rounded-lg border border-dashed border-line bg-surface text-small text-muted');
          lab.append(icon(ICONS.camera, 'h-6 w-6'), el('span', '', 'Add photo'));
          const input = el('input', 'sr-only');
          input.type = 'file';
          input.accept = 'image/png,image/jpeg,image/webp';
          input.addEventListener('change', () => {
            const f = input.files && input.files[0];
            input.value = '';
            if (f) upload(f);
          });
          lab.append(input);
          photoRow.append(lab);
        }
        update();
      }

      // Scale the longest side to 1600 px and export JPEG at 0.85, so a
      // phone camera photo fits the platform's 5 MB limit.
      function shrink(file) {
        return new Promise((resolve, reject) => {
          const url = URL.createObjectURL(file);
          const img = new Image();
          img.onload = () => {
            try {
              const max = 1600;
              const scale = Math.min(1, max / Math.max(img.width, img.height));
              const w = Math.max(1, Math.round(img.width * scale));
              const h = Math.max(1, Math.round(img.height * scale));
              const canvas = document.createElement('canvas');
              canvas.width = w;
              canvas.height = h;
              canvas.getContext('2d').drawImage(img, 0, 0, w, h);
              URL.revokeObjectURL(url);
              canvas.toBlob(b => (b ? resolve(b) : reject(new Error('encode'))), 'image/jpeg', 0.85);
            } catch (err) { URL.revokeObjectURL(url); reject(err); }
          };
          img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('decode')); };
          img.src = url;
        });
      }

      async function upload(file) {
        if (!window.usernode || typeof window.usernode.uploadFile !== 'function') {
          note.replaceChildren(banner("Photo upload isn't available here. You can post without photos.", true));
          return;
        }
        uploading++;
        drawPhotos();
        try {
          const blob = await shrink(file);
          const stored = await window.usernode.uploadFile(blob, { visibility: 'public' });
          if (!stored || !stored.url || !stored.id) throw new Error('Upload failed');
          photos.push({ url: stored.url, id: stored.id });
        } catch (e) {
          console.error(String(e && e.stack || e));
          note.replaceChildren(banner(
            e && e.message === 'decode'
              ? "That photo couldn't be read. Try a JPEG or PNG."
              : "Photo upload isn't available here. You can post without photos.",
            true));
        } finally {
          uploading--;
          drawPhotos();
        }
      }

      function priceValue() {
        const n = Number(priceIn.value);
        return Number.isFinite(n) ? Math.round(n) : NaN;
      }
      function valid() {
        if (uploading > 0) return false;
        if (titleIn.value.trim().length < 3) return false;
        if (!category || !areaIn.value || !condition || !listingType) return false;
        if (listingType === 'price') {
          const p = priceValue();
          if (!(p >= 1000 && p <= 1000000)) return false;
        }
        return true;
      }
      function update() {
        if (submit) submit.disabled = !valid();
      }

      submit = el('button', 'btn-primary w-full', 'Post item');
      submit.type = 'submit';
      submit.disabled = true;

      form.append(
        photosBox,
        fieldRow('Title', titleIn),
        fieldRow('Short description', descIn)
      );
      // Condition chips.
      const condBox = el('div', 'flex flex-col gap-1');
      condBox.append(el('span', 'px-1 text-small font-medium text-muted', 'Condition'), condRow);
      const typeBox = el('div', 'flex flex-col gap-1');
      typeBox.append(el('span', 'px-1 text-small font-medium text-muted', 'Free, Swap or Price'), typeRow);
      form.append(condBox, catRow, typeBox, priceWrap, submit);

      catIn.addEventListener('change', () => { category = catIn.value; update(); });
      titleIn.addEventListener('input', update);
      priceIn.addEventListener('input', update);
      priceWrap.hidden = listingType !== 'price';

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        if (!valid()) return;
        submit.disabled = true;
        try {
          const body = {
            title: titleIn.value,
            description: descIn.value,
            condition,
            category,
            area: areaIn.value,
            listing_type: listingType,
            price_idr: listingType === 'price' ? priceValue() : null,
            photos: photos.map(p => ({ url: p.url, id: p.id })),
          };
          const d = await api('/api/items', { method: 'POST', body: JSON.stringify(body) });
          go('item', String(d.item.id));
        } catch (err) {
          const text =
            err.code === 'invalid_photo' ? 'One photo could not be saved. Remove it and try again.' :
            err.code === 'invalid_price' ? 'Enter a price between Rp 1,000 and Rp 1,000,000.' :
            err.code === 'invalid_title' ? 'Give the item a title of at least 3 characters.' :
            err.code === 'account_required' ? 'Make an account to post an item.' :
            'Posting failed. Try again.';
          note.replaceChildren(banner(text, true));
          submit.disabled = !valid();
        }
      });

      // Keep the price field in step with the chosen type.
      const drawAll = () => { drawChips(); priceWrap.hidden = listingType !== 'price'; };
      drawAll();
      drawPhotos();
      root.append(note, form);
      return root;
    };

    // ── Item Detail ────────────────────────────────────────────────────────
    routes.item = async function itemView(idStr) {
      await loadMe(true);
      renderTabbar('home');
      const root = el('section', 'flex flex-col gap-4');
      const back = el('button', 'min-h-11 self-start text-small text-muted', '‹ Back');
      back.type = 'button';
      back.addEventListener('click', () => go('home'));
      const host = el('div');
      root.append(back, host);

      const id = parseInt(idStr, 10);
      if (!Number.isInteger(id) || id <= 0) {
        host.append(pageError("This item isn't available", 'It may have been taken down.', 'Back to Home', () => go('home')));
        return root;
      }

      const loading = el('div', 'list');
      loading.setAttribute('role', 'status');
      loading.append(el('span', 'sr-only', 'Loading the item'));
      for (const w of ['w-2/3', 'w-1/2']) {
        const r = el('div', 'list-row');
        r.append(el('div', 'skeleton h-4 ' + w));
        loading.append(r);
      }
      host.append(loading);

      let d;
      try {
        d = await api('/api/items/' + id);
      } catch (e) {
        host.replaceChildren(pageError("This item isn't available", 'It may have been taken down.', 'Back to Home', () => go('home')));
        return root;
      }
      loading.remove();
      const item = d.item;
      const photos = item.photos || [];
      const content = el('div', 'flex flex-col gap-4');

      if (d.is_owner && item.hidden) content.append(banner('Hidden by a moderator'));

      // Photos, swipeable.
      if (photos.length) {
        const strip = el('div', 'flex snap-x snap-mandatory gap-2 overflow-x-auto');
        for (const p of photos) {
          strip.append(photo(p.url, item.category, 'aspect-square w-11/12 shrink-0 snap-center rounded-xl object-cover bg-raised', item.title));
        }
        content.append(strip);
        if (photos.length > 1) {
          const dots = el('div', 'flex justify-center gap-1.5');
          photos.forEach((_, i) => dots.append(el('span', 'h-2 w-2 rounded-full ' + (i === 0 ? 'bg-accent' : 'bg-line'))));
          strip.addEventListener('scroll', () => {
            const idx = Math.round(strip.scrollLeft / strip.clientWidth);
            Array.from(dots.children).forEach((dot, i) => {
              dot.className = 'h-2 w-2 rounded-full ' + (i === idx ? 'bg-accent' : 'bg-line');
            });
          }, { passive: true });
          content.append(dots);
        }
      } else {
        content.append(photo(null, item.category, 'aspect-square w-full rounded-xl object-cover bg-raised', item.title));
      }

      content.append(el('h1', 'text-heading', item.title));
      const tags = el('div', 'flex flex-wrap gap-1.5');
      tags.append(badge(priceLabel(item)), badge(CONDITION_LABEL[item.condition]),
        badge(CATEGORY_LABEL[item.category]), badge(STATUS_LABEL[item.status]));
      content.append(tags);

      if (item.description) content.append(el('p', 'text-body', item.description));

      const dist = distanceLabel(blocksFrom(item.area));
      content.append(el('p', 'text-small text-muted',
        'Posted by ' + item.owner_name + ' · ' + item.area + (dist ? ' · ' + dist : '')));

      if (item.status === 'reserved' && !d.is_owner && d.my_request && d.my_request.status === 'accepted') {
        content.append(banner('Reserved for you. Meet the owner at ' + item.area + '.'));
      } else if (!d.is_owner && item.status !== 'available') {
        content.append(banner(item.hidden ? 'No longer listed' : 'This item is no longer available.'));
      }

      // Owner: the requests on their item.
      if (d.is_owner) {
        const reqBox = el('section', 'flex flex-col gap-2');
        reqBox.append(el('h2', 'section-label', 'Requests'));
        const list = el('ul', 'list');
        const requests = d.requests || [];
        if (!requests.length) {
          list.append(el('li', 'list-row text-small text-muted', 'No requests yet.'));
        }
        const actions = [];
        for (const r of requests) {
          const li = el('li', 'list-row flex-col items-stretch gap-2');
          const top = el('div', 'flex items-start justify-between gap-2');
          const left = el('div', 'min-w-0');
          left.append(
            el('p', 'text-body font-medium', r.requester_name),
            el('p', 'text-small', r.message),
            el('p', 'text-small text-muted', fmtDate(r.created_at))
          );
          top.append(left, badge(REQUEST_LABEL[r.status] || r.status));
          li.append(top);
          if (r.status === 'pending') {
            const row = el('div', 'flex gap-2');
            const accept = el('button', 'btn-primary min-h-11 flex-1', 'Accept');
            accept.type = 'button';
            accept.addEventListener('click', () => act('/api/requests/' + r.id + '/accept', 'accept', accept));
            const decline = el('button', 'btn-secondary', 'Decline');
            decline.type = 'button';
            decline.addEventListener('click', () => act('/api/requests/' + r.id + '/decline', 'decline', decline));
            row.append(accept, decline);
            li.append(row);
            actions.push(accept, decline);
          }
          list.append(li);
        }
        reqBox.append(list);

        if (item.status === 'reserved') {
          const row = el('div', 'flex flex-col gap-2');
          const doneB = el('button', 'btn-primary w-full', 'Mark as done');
          doneB.type = 'button';
          doneB.addEventListener('click', () => act('/api/items/' + item.id + '/status', '', doneB, { status: 'done' }));
          const freeB = el('button', 'btn-secondary w-full', 'Make available again');
          freeB.type = 'button';
          freeB.addEventListener('click', () => act('/api/items/' + item.id + '/status', '', freeB, { status: 'available' }));
          row.append(doneB, freeB);
          reqBox.append(row);
        } else if (item.status === 'available') {
          const doneB = el('button', 'btn-secondary w-full', 'Mark as done');
          doneB.type = 'button';
          doneB.addEventListener('click', () => act('/api/items/' + item.id + '/status', '', doneB, { status: 'done' }));
          reqBox.append(doneB);
        }
        content.append(reqBox);

        async function act(path, _kind, btn, body) {
          btn.disabled = true;
          try {
            await api(path, { method: 'POST', body: JSON.stringify(body || {}) });
            route();
          } catch (e) {
            noteBox.replaceChildren(banner(
              e.code === 'not_available' ? 'That changed already. Reloading the item.' :
              e.code === 'invalid_transition' ? 'That is no longer possible.' :
              'That failed. Try again.', true));
            btn.disabled = false;
          }
        }
      }

      const noteBox = el('div');
      content.append(noteBox);

      // Someone else's item: ask for it, cancel, or report it.
      if (!d.is_owner) {
        const mine = d.my_request;
        const canAsk = item.status === 'available' && (!mine || mine.status === 'declined' || mine.status === 'cancelled');
        if (mine && (mine.status === 'pending' || mine.status === 'accepted')) {
          const sent = el('div', 'flex flex-col gap-2');
          sent.append(banner(mine.status === 'pending'
            ? 'Your request was sent. The owner replies in My Loops.'
            : 'This item is reserved for you.'));
          const cancel = el('button', 'btn-secondary w-full', 'Cancel request');
          cancel.type = 'button';
          cancel.addEventListener('click', async () => {
            cancel.disabled = true;
            try {
              await api('/api/requests/' + mine.id + '/cancel', { method: 'POST' });
              route();
            } catch (e) {
              noteBox.replaceChildren(banner(
                e.code === 'invalid_transition' ? 'This loop is already done, so it can no longer be cancelled.' :
                'That failed. Try again.', true));
              cancel.disabled = false;
            }
          });
          sent.append(cancel);
          content.append(sent);
        } else if (canAsk) {
          if (mine && mine.status === 'declined') {
            noteBox.append(banner('The owner declined your request. You can ask again.'));
          }
          const ask = el('div', 'flex flex-col gap-2');
          const msg = el('textarea', 'field min-h-20');
          msg.maxLength = 200;
          msg.placeholder = 'Message to the owner, for example when you can pick it up';
          const req = el('button', 'btn-primary w-full', 'Request this item');
          req.type = 'button';
          req.disabled = true;
          msg.addEventListener('input', () => { req.disabled = msg.value.trim().length === 0; });
          req.addEventListener('click', async () => {
            req.disabled = true;
            try {
              await api('/api/items/' + item.id + '/requests', {
                method: 'POST',
                body: JSON.stringify({ message: msg.value }),
              });
              route();
            } catch (e) {
              const text =
                e.code === 'own_item' ? 'This is your own item.' :
                e.code === 'not_available' ? 'This item is no longer available.' :
                e.code === 'already_requested' ? 'You have already asked for this item.' :
                e.code === 'account_required' ? 'Make an account to request an item.' :
                'Sending failed. Try again.';
              noteBox.replaceChildren(banner(text, true));
              req.disabled = false;
            }
          });
          ask.append(msg, req);
          content.append(ask);
        }

        // Report: always available on someone else's item.
        if (!item.hidden) {
          const repBtn = el('button', 'min-h-11 self-start px-1 text-small text-muted underline', 'Report this item');
          repBtn.type = 'button';
          const repForm = el('div', 'hidden flex-col gap-2');
          const reasonSel = selectField(REPORT_REASONS, 'not_secondhand');
          const noteIn = el('textarea', 'field min-h-16');
          noteIn.maxLength = 200;
          noteIn.placeholder = 'Add a note (optional)';
          const send = el('button', 'btn-secondary w-full', 'Send report');
          send.type = 'button';
          repBtn.addEventListener('click', () => {
            repForm.classList.toggle('hidden');
            repForm.classList.toggle('flex');
          });
          send.addEventListener('click', async () => {
            send.disabled = true;
            try {
              await api('/api/items/' + item.id + '/report', {
                method: 'POST',
                body: JSON.stringify({ reason: reasonSel.value, note: noteIn.value }),
              });
              repForm.replaceChildren(banner('Thanks. A moderator will look at it.'));
            } catch (e) {
              repForm.replaceChildren(banner(
                e.code === 'account_required' ? 'Make an account to report an item.' :
                'Sending the report failed. Try again.', true));
            }
          });
          if (d.reported_by_me) {
            content.append(el('p', 'text-small text-muted', 'Thanks. A moderator will look at it.'));
          } else {
            repForm.append(fieldRow('Reason', reasonSel), fieldRow('Note', noteIn), send);
            content.append(repBtn, repForm);
          }
        }
      }

      host.replaceChildren(content);
      return root;
    };

    routes.loops = async function loopsView() {
      await loadMe(true);
      renderTabbar('loops');
      const root = el('section', 'flex flex-col gap-4');
      root.append(el('h1', 'text-title', 'My Loops'));

      if (state.guest || !state.member) {
        const c = el('div', 'card flex flex-col gap-2');
        c.append(
          el('p', 'text-heading', 'Make an account to use My Loops'),
          el('p', 'text-body text-muted', 'Sign in with Homeroom to post items and ask for what you need.')
        );
        root.append(c);
        return root;
      }

      const host = el('div');
      root.append(segmented([['items', 'My Items'], ['requests', 'My Requests']], state.loopsTab, (id) => {
        state.loopsTab = id;
        route();
      }), host);
      const st = makeStates(host, {
        errorTitle: "Couldn't load your loops",
        errorBody: 'Check your connection and try again.',
        loadingText: 'Loading your loops',
      });
      st.retry = load;
      st.listEl.className = 'flex flex-col gap-4';

      function actionButton(label, onClick) {
        const b = el('button', 'btn-primary', label);
        b.type = 'button';
        b.addEventListener('click', onClick);
        return b;
      }

      async function load() {
        st.show('loading');
        try {
          if (state.loopsTab === 'items') {
            const d = await api('/api/my/items');
            if (!d.items.length) {
              st.setEmpty('No items posted yet', 'Post something you no longer need, and a neighbor can give it a new home.',
                actionButton('Post an item', () => go('post')));
              st.show('empty');
              return;
            }
            st.listEl.replaceChildren(...loopRows(d.items));
          } else {
            const d = await api('/api/my/requests');
            if (!d.requests.length) {
              st.setEmpty('No requests yet', 'Ask for something in the feed and it will appear here.',
                actionButton('Browse nearby items', () => go('home')));
              st.show('empty');
              return;
            }
            st.listEl.replaceChildren(...loopRequestRows(d.requests));
          }
          st.show('list');
        } catch (e) { console.error(String(e && e.stack || e)); st.show('error'); }
      }

      function loopRows(items) {
        return items.map(it => {
          let line;
          let statusText = STATUS_LABEL[it.status];
          if (it.hidden) {
            line = 'Hidden by a moderator';
            statusText = 'Hidden';
          } else if (it.status === 'reserved') {
            line = it.accepted_name ? 'Reserved for ' + it.accepted_name : 'Reserved';
          } else if (it.status === 'done') {
            line = it.accepted_name ? 'Given to ' + it.accepted_name : 'Done';
          } else if (it.pending_count > 0) {
            line = it.pending_count + (it.pending_count === 1 ? ' request waiting' : ' requests waiting');
          } else {
            line = CONDITION_LABEL[it.condition] + ' · ' + it.area;
          }
          return loopRow({
            itemId: it.id,
            photoUrl: it.photo_url,
            category: it.category,
            title: it.title,
            line: line,
            statusText: statusText,
          });
        });
      }

      function loopRequestRows(requests) {
        return requests.map(r => {
          if (r.item_unavailable) {
            return loopRow({
              itemId: r.item_id,
              category: 'kitchen',
              title: 'No longer listed',
              line: REQUEST_LABEL[r.status] || r.status,
              statusText: 'No longer listed',
            });
          }
          return loopRow({
            itemId: r.item_id,
            photoUrl: r.photo_url,
            category: r.category || 'kitchen',
            title: r.title,
            line: REQUEST_LABEL[r.status] || r.status,
            statusText: STATUS_LABEL[r.item_status] || r.item_status,
          });
        });
      }

      await load();
      return root;
    };

    // ── Impact ────────────────────────────────────────────────────────────
    routes.impact = async function impactView() {
      await loadMe(true);
      renderTabbar('impact');
      const root = el('section', 'flex flex-col gap-4');
      root.append(el('h1', 'text-title', 'Impact'));

      const host = el('div');
      root.append(host);
      const st = makeStates(host, {
        errorTitle: "Couldn't load your impact",
        errorBody: 'Check your connection and try again.',
        loadingText: 'Loading your impact',
      });
      st.retry = load;
      st.listEl.className = 'flex flex-col gap-4';

      function numberCard(label, value, caption) {
        const c = el('div', 'card flex flex-col gap-1');
        c.append(el('p', 'text-small text-muted', label),
          el('p', 'text-title tabular-nums', value),
          el('p', 'text-small text-muted', caption));
        return c;
      }

      async function load() {
        st.show('loading');
        try {
          const d = await api('/api/impact');
          const nodes = [];
          if (d.you) {
            const tiles = el('div', 'grid grid-cols-2 gap-2');
            tiles.append(
              numberCard('Items reused', fmt(d.you.loops), 'your completed loops'),
              numberCard('Estimated kg of waste avoided', kgLabel(d.you.grams), 'an estimate')
            );
            const badgeSection = el('section', 'flex flex-col gap-2');
            badgeSection.append(el('h2', 'section-label', 'Badges'));
            const row = el('div', 'flex flex-wrap gap-3');
            const size = d.badge_size || 5;
            const earned = Math.floor(d.you.loops / size);
            const shown = Math.max(earned + 1, 1);
            for (let i = 1; i <= shown; i++) {
              const isEarned = i <= earned;
              row.append(el('span', 'flex h-16 w-16 items-center justify-center rounded-full border-2 text-small font-medium ' +
                (isEarned ? 'border-accent text-accent' : 'border-dashed border-line text-muted'), String(i * size)));
            }
            badgeSection.append(row);
            const toNext = earned * size + size - d.you.loops;
            badgeSection.append(el('p', 'text-small text-muted',
              toNext + (toNext === 1 ? ' more completed loop to your next badge.' : ' more completed loops to your next badge.')));
            nodes.push(tiles, badgeSection);
          } else {
            const c = el('div', 'card flex flex-col gap-2');
            c.append(
              el('p', 'text-heading', 'Make an account to start your own loops'),
              el('p', 'text-body text-muted', 'Every item you give or receive counts as one loop kept in use.')
            );
            const b = el('button', 'btn-secondary self-start', 'Browse nearby items');
            b.type = 'button';
            b.addEventListener('click', () => go('home'));
            c.append(b);
            nodes.push(c);
          }
          const hood = el('section', 'flex flex-col gap-2');
          hood.append(el('h2', 'section-label', 'The neighborhood'));
          const hc = el('div', 'card');
          hc.append(el('p', 'text-body',
            fmt(d.neighbourhood.loops) + (d.neighbourhood.loops === 1 ? ' item reused' : ' items reused') +
            ' · about ' + kgLabel(d.neighbourhood.grams) + ' of waste avoided (estimate)'));
          hood.append(hc);
          nodes.push(hood);
          st.listEl.replaceChildren(...nodes);
          st.show('list');
        } catch (e) { console.error(String(e && e.stack || e)); st.show('error'); }
      }

      await load();
      return root;
    };

    // ── Profile ───────────────────────────────────────────────────────────
    routes.profile = async function profileView() {
      const root = el('section', 'flex flex-col gap-4');
      root.append(el('h1', 'text-title', 'Profile'));
      await loadMe(true);

      if (state.guest || !state.member) {
        const c = el('div', 'card flex flex-col gap-2');
        c.append(
          el('p', 'text-heading', 'Make an account to use ReLoop'),
          el('p', 'text-body text-muted', 'ReLoop keeps your items, requests and loops with your Homeroom account. Sign in to continue.')
        );
        root.append(c);
        return root;
      }

      const note = el('div');
      const form = el('form', 'flex flex-col gap-3');
      const nameIn = textField();
      nameIn.value = state.member.display_name || '';
      nameIn.maxLength = 120;
      const areaIn = selectField([['', 'Not set']].concat(state.areas.map(a => [a, a])), state.member.pickup_area || '');
      form.append(fieldRow('Display name', nameIn), fieldRow('Pickup area', areaIn));
      const save = el('button', 'btn-primary self-start', 'Save');
      save.type = 'submit';
      form.append(save);
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        save.disabled = true;
        try {
          await api('/api/me', {
            method: 'PATCH',
            body: JSON.stringify({ display_name: nameIn.value, pickup_area: areaIn.value }),
          });
          await loadMe(true);
          note.replaceChildren(banner('Profile saved.'));
        } catch (err) {
          note.replaceChildren(banner(
            err.code === 'invalid_area' ? 'Pick one of the neighborhood areas.' :
            'Saving failed. Try again.', true));
        } finally {
          save.disabled = false;
        }
      });
      root.append(note, form);
      root.append(el('p', 'px-1 text-small text-muted',
        'Your pickup area is shared as a block distance. It never shows your house number.'));

      const role = el('p', 'px-1 text-small text-muted',
        'Role: ' + (state.member.is_admin ? 'Moderator' : 'Member'));
      root.append(role);

      // One-time setup for the neighborhood's first moderator.
      if (!state.member.is_admin) {
        const setup = el('details', 'card');
        const summary = el('summary', 'cursor-pointer text-body font-medium', 'Moderator setup');
        const inner = el('div', 'mt-3 flex flex-col gap-3');
        const codeIn = textField();
        codeIn.placeholder = 'Setup code';
        const activate = el('button', 'btn-secondary self-start', 'Activate');
        activate.type = 'button';
        const setupNote = el('div');
        activate.addEventListener('click', async () => {
          activate.disabled = true;
          try {
            await api('/api/admin/setup', { method: 'POST', body: JSON.stringify({ code: codeIn.value }) });
            await loadMe(true);
            route();
          } catch (e2) {
            setupNote.replaceChildren(banner(
              e2.code === 'setup_not_configured'
                ? 'Moderator setup is not configured for this app yet. Set the setup code in the app settings first.'
                : e2.code === 'invalid_code'
                  ? 'That code does not match. Ask the neighborhood for the current setup code.'
                  : 'Activation failed. Try again.',
              true));
          } finally {
            activate.disabled = false;
          }
        });
        inner.append(
          el('p', 'text-small text-muted', 'Enter the setup code agreed with your neighborhood to become its first moderator. This is a one-time step.'),
          fieldRow('Setup code', codeIn),
          activate,
          setupNote
        );
        setup.append(summary, inner);
        root.append(setup);
      }
      return root;
    };

    // ── Moderate ──────────────────────────────────────────────────────────
    routes.moderate = async function moderateView() {
      await loadMe(true);
      renderTabbar('moderate');
      const root = el('section', 'flex flex-col gap-4');
      root.append(el('h1', 'text-title', 'Moderate'));

      if (!state.isAdmin) {
        const c = el('div', 'card flex flex-col gap-2');
        c.append(
          el('p', 'text-heading', 'Moderators only'),
          el('p', 'text-body text-muted', 'This area is for neighborhood moderators. If you are one, activate your role from the Profile tab.')
        );
        const b = el('button', 'btn-secondary self-start', 'Go to Profile');
        b.type = 'button';
        b.addEventListener('click', () => go('profile'));
        c.append(b);
        root.append(c);
        return root;
      }

      const host = el('div');
      root.append(segmented([['reports', 'Reports'], ['moderators', 'Moderators']], state.modTab, (id) => {
        state.modTab = id;
        route();
      }), host);
      const st = makeStates(host, {
        errorTitle: "Couldn't load this",
        errorBody: 'Check your connection and try again.',
        loadingText: 'Loading',
      });
      st.retry = load;

      async function resolve(itemId, action) {
        try {
          await api('/api/reports/items/' + itemId + '/resolve', {
            method: 'POST',
            body: JSON.stringify({ action }),
          });
          await load();
        } catch (e) {
          host.prepend(banner('That failed. Try again.', true));
        }
      }

      async function load() {
        st.show('loading');
        st.listEl.className = 'list';
        try {
          if (state.modTab === 'reports') {
            const d = await api('/api/reports');
            if (!d.reports.length) {
              st.setEmpty('No open reports', 'When someone reports an item, it appears here for review.');
              st.show('empty');
              return;
            }
            st.listEl.replaceChildren(...d.reports.map(r => {
              const li = el('li', 'list-row flex-col items-stretch gap-2');
              const top = el('div', 'flex items-start gap-3');
              top.append(photo(r.photo_url, 'kitchen', 'h-12 w-12 shrink-0 rounded-lg object-cover bg-raised', ''));
              const mid = el('div', 'min-w-0 flex-1');
              mid.append(
                el('p', 'text-body font-medium', r.title),
                el('p', 'text-small text-muted', 'Posted by ' + r.owner_name + ' · ' +
                  r.report_count + (r.report_count === 1 ? ' report' : ' reports')),
                el('p', 'text-small text-muted', r.reports.map(x => {
                  const label = (REPORT_REASONS.find(v => v[0] === x.reason) || [null, x.reason])[1];
                  return x.note ? label + ': ' + x.note : label;
                }).join(' · '))
              );
              top.append(mid);
              if (r.hidden) top.append(badge('Hidden'));
              li.append(top);
              const actions = el('div', 'flex gap-2');
              const hide = el('button', 'btn-primary flex-1', 'Hide item');
              hide.type = 'button';
              hide.disabled = r.hidden;
              hide.addEventListener('click', () => resolve(r.item_id, 'hide'));
              const keep = el('button', 'btn-secondary', 'Keep');
              keep.type = 'button';
              keep.addEventListener('click', () => resolve(r.item_id, 'keep'));
              actions.append(hide, keep);
              li.append(actions);
              return li;
            }));
            st.show('list');
            return;
          }
          const d = await api('/api/members');
          if (!d.members.length) {
            st.setEmpty('No members yet', 'Members appear here the first time they open ReLoop.');
            st.show('empty');
            return;
          }
          st.listEl.replaceChildren(...d.members.map(m => {
            const li = el('li', 'list-row items-start justify-between gap-3');
            const left = el('div', 'min-w-0');
            left.append(el('p', 'text-body font-medium', m.display_name || m.username),
              el('p', 'text-small text-muted', '@' + m.username));
            const right = el('div', 'flex shrink-0 flex-col items-end gap-1');
            const isSelf = state.member && state.member.id === m.id;
            const b = el('button', m.is_admin ? 'btn-secondary' : 'btn-primary', m.is_admin ? 'Remove moderator' : 'Make moderator');
            b.type = 'button';
            if (isSelf && m.is_admin) b.disabled = true;
            b.addEventListener('click', async () => {
              b.disabled = true;
              try {
                await api('/api/members/' + m.id, {
                  method: 'PATCH',
                  body: JSON.stringify({ is_admin: !m.is_admin }),
                });
                await load();
              } catch (e) {
                host.prepend(banner(
                  e.code === 'cannot_demote_self' ? "You can't remove yourself." :
                  'That failed. Try again.', true));
                b.disabled = false;
              }
            });
            right.append(badge(m.is_admin ? 'Moderator' : 'Member'), b);
            if (isSelf && m.is_admin) right.append(el('p', 'text-small text-muted', "You can't remove yourself"));
            li.append(left, right);
            return li;
          }));
          st.show('list');
        } catch (e) { console.error(String(e && e.stack || e)); st.show('error'); }
      }

      await load();
      return root;
    };

    // ── Boot ───────────────────────────────────────────────────────────────
    // Views await loadMe() themselves; once it lands, refresh the tab bar so
    // the Moderate tab appears for moderators.
    route();
    loadMe().then(() => renderTabbar(currentRoute()));
  })();
  </script>
</body>
</html>
