<head>

  <script>
  // usernode-dev-console@1
  (function () {
    if (window.__usernodeDevConsole) return;
    window.__usernodeDevConsole = true;
    var S = '__usernodeDevConsole';
    function serialize(v, depth) {
      depth = depth || 0;
      try {
        if (v === undefined) return 'undefined';
        if (v === null) return 'null';
        if (typeof v === 'string') return v;
        if (typeof v === 'number' || typeof v === 'boolean') return String(v);
        if (typeof v === 'function') return '[Function ' + (v.name || 'anonymous') + ']';
        if (v instanceof Error) return (v.stack || (v.name + ': ' + v.message));
        if (depth > 3) return '[…]';
        var seen = new WeakSet();
        return JSON.stringify(v, function (k, val) {
          if (typeof val === 'object' && val !== null) {
            if (seen.has(val)) return '[Circular]';
            seen.add(val);
          }
          if (typeof val === 'function') return '[Function ' + (val.name || 'anonymous') + ']';
          if (val instanceof Error) return val.stack || (val.name + ': ' + val.message);
          return val;
        });
      } catch (e) { try { return String(v); } catch (_) { return '[unserializable]'; } }
    }
    function post(level, args, meta) {
      try {
        var payload = {
          sentinel: S,
          level: level,
          args: Array.prototype.slice.call(args).map(function (a) { return serialize(a); }),
          ts: Date.now(),
          url: location.href,
        };
        if (meta) for (var k in meta) payload[k] = meta[k];
        if (window.parent && window.parent !== window) {
          window.parent.postMessage(payload, '*');
        }
      } catch (_) {}
    }
    ['log','info','warn','error','debug'].forEach(function (level) {
      var orig = console[level] ? console[level].bind(console) : function () {};
      console[level] = function () { post(level, arguments); orig.apply(null, arguments); };
    });
    window.addEventListener('error', function (e) {
      var msg = (e.error && (e.error.stack || e.error.message)) || e.message || 'Error';
      post('error', [msg], { source: e.filename || '', line: e.lineno || 0, col: e.colno || 0, kind: 'error' });
    });
    window.addEventListener('unhandledrejection', function (e) {
      var r = e.reason;
      var msg = (r && (r.stack || r.message)) || String(r);
      post('error', [msg], { kind: 'unhandledrejection' });
    });
    try { post('info', ['[dev-console ready]'], { kind: 'ready' }); } catch (_) {}
  })();
  </script>
  <title>ReLoop: Return. Reuse. Reward.</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%230f766e'/><path d='M30 40a22 22 0 0 1 40 0' stroke='white' stroke-width='9' fill='none' stroke-linecap='round'/><path d='M70 60a22 22 0 0 1-40 0' stroke='white' stroke-width='9' fill='none' stroke-linecap='round'/></svg>">
  <!-- Tailwind, PRECOMPILED for this app. The config lives in
       tailwind.config.js and npm run build compiles styles/tailwind-input.css
       to public/tailwind.css on every image build, so the stylesheet is
       regenerated from THIS commit's markup and can never drift behind the
       code. Writing class names as whole literals is what keeps this
       working — a class assembled from fragments at runtime is invisible to
       the compiler. -->
  <link rel="stylesheet" href="/tailwind.css">
  <!-- The platform bridge, centrally hosted and loaded by RELATIVE path (the
       handler in server.js serves it under a plain "node server.js"; the
       platform's edge answers it everywhere else). Never vendor it and never
       write a hostname in front of it. It is also how the app ANSWERS the
       shell, and where file uploads and the account prompt come from. -->
  <script src="/usernode-bridge/v1/bridge.js"></script>
  <script>
    // ReLoop has one fixed look: a warm dark one (see "## Design" in
    // CLAUDE.md). Both the light and the dark token sets in
    // styles/tailwind-input.css carry the same values, so the viewer's
    // Homeroom theme has nothing to switch here.
    (function () {
      document.documentElement.classList.add('dark');
      document.documentElement.style.colorScheme = 'dark';
    })();
  </script>
</head>
<body class="min-h-screen bg-ground text-fg">
  <main id="app" class="mx-auto flex min-h-screen max-w-md flex-col px-4 pb-28 pt-6"></main>

  <!-- The bottom tab bar. Buttons are 44 px+ targets; the active tab takes
       the accent colour. -->
  <nav class="tab-nav" aria-label="Main">
    <div id="tabbar" class="mx-auto flex max-w-md"></div>
  </nav>

  <script>
  (function () {
    'use strict';

    // ── Platform plumbing ──────────────────────────────────────────────────
    // The iframe adds ?token=… on load; forward it on every fetch exactly
    // like the starter template did.
    const params = new URLSearchParams(window.location.search);
    const TOKEN = params.get('token') || '';
    const HEADERS = Object.assign(
      { 'Content-Type': 'application/json' },
      TOKEN ? { 'x-usernode-token': TOKEN } : {}
    );

    async function api(path, opts) {
      // A staging preview opened as of another moment tells the server that
      // moment too, so anything time-dependent matches what the page shows.
      const headers = window.usernode && window.usernode.previewNow
        ? Object.assign({ 'x-usernode-now': window.usernode.now().toISOString() }, HEADERS)
        : HEADERS;
      const res = await fetch(path, Object.assign({ headers: headers }, opts || {}));
      let data = null;
      try { data = await res.json(); } catch (_) {}
      if (!res.ok) {
        const err = new Error((data && data.error) || ('HTTP ' + res.status));
        err.status = res.status;
        err.code = data && data.error;
        err.data = data;
        throw err;
      }
      return data;
    }

    // ── Tiny DOM helpers ───────────────────────────────────────────────────
    // Everything renders through textContent — titles, descriptions and
    // messages are other people's input and never become HTML.
    function el(tag, cls, text) {
      const e = document.createElement(tag);
      if (cls) e.className = cls;
      if (text !== undefined && text !== null) e.textContent = text;
      return e;
    }

    function icon(paths, cls) {
      const NS = 'http://www.w3.org/2000/svg';
      const svg = document.createElementNS(NS, 'svg');
      svg.setAttribute('viewBox', '0 0 24 24');
      svg.setAttribute('fill', 'none');
      svg.setAttribute('stroke', 'currentColor');
      svg.setAttribute('stroke-width', '1.8');
      svg.setAttribute('stroke-linecap', 'round');
      svg.setAttribute('stroke-linejoin', 'round');
      svg.setAttribute('aria-hidden', 'true');
      if (cls) svg.setAttribute('class', cls);
      for (const d of [].concat(paths)) {
        const p = document.createElementNS(NS, 'path');
        p.setAttribute('d', d);
        svg.appendChild(p);
      }
      return svg;
    }

    const ICONS = {
      home: ['M3 10.5 12 3l9 7.5', 'M5 9.5V21h14V9.5'],
      post: ['M12 5v14', 'M5 12h14'],
      loops: ['M17 2l4 4-4 4', 'M3 11v-1a4 4 0 0 1 4-4h14', 'M7 22l-4-4 4-4', 'M21 13v1a4 4 0 0 1-4 4H3'],
      impact: ['M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.5 19 2c1 2 2 4.2 2 8 0 5.5-4.8 10-10 10Z',
        'M2 21c0-3 1.9-5.3 5.1-6C9.5 14.5 12 13 13 12'],
      profile: ['M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z', 'M5 21a7 7 0 0 1 14 0'],
      chevron: ['M9 6l6 6-6 6'],
      alert: ['M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18Z', 'M12 8v5', 'M12 16h.01'],
      camera: ['M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3L14.5 4Z',
        'M12 17a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z'],
      clothes: ['M20.38 3.46 16 2a4 4 0 0 1-8 0L3.62 3.46a2 2 0 0 0-1.34 2.23l.58 3.47a1 1 0 0 0 .99.84H6v10c0 1.1.9 2 2 2h8a2 2 0 0 0 2-2V10h2.15a1 1 0 0 0 .99-.84l.58-3.47a2 2 0 0 0-1.34-2.23z'],
      electronics: ['M7 2h10a2 2 0 0 1 2 2v16a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2Z', 'M11 18h2'],
      furniture: ['M19 9V6a2 2 0 0 0-2-2H7a2 2 0 0 0-2 2v3',
        'M3 16a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-5a2 2 0 0 0-4 0v2H7v-2a2 2 0 0 0-4 0Z', 'M5 18v2', 'M19 18v2'],
      books: ['M12 7v14',
        'M3 18a1 1 0 0 1-1-1V4a2 2 0 0 1 2-2h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a2 2 0 0 1 2 2v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z'],
      kitchen: ['M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2', 'M7 2v20',
        'M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7'],
    };
    const CATEGORY_ICON = {
      clothes: ICONS.clothes,
      electronics: ICONS.electronics,
      furniture: ICONS.furniture,
      books: ICONS.books,
      kitchen: ICONS.kitchen,
    };

    // ── The neighborhood's fixed vocabulary ────────────────────────────────
    // Same ids the server validates against.
    const ZONES = [
      { id: 'rt01', label: 'RT 01' }, { id: 'rt02', label: 'RT 02' },
      { id: 'rt03', label: 'RT 03' }, { id: 'rt04', label: 'RT 04' },
      { id: 'rt05', label: 'RT 05' }, { id: 'rt06', label: 'RT 06' },
    ];
    const CATEGORIES = [
      { id: 'clothes', label: 'Clothes' }, { id: 'electronics', label: 'Electronics' },
      { id: 'furniture', label: 'Furniture' }, { id: 'books', label: 'Books' },
      { id: 'kitchen', label: 'Kitchen' },
    ];
    const CONDITIONS = [
      { id: 'like_new', label: 'Like new' }, { id: 'good', label: 'Good' }, { id: 'worn', label: 'Worn' },
    ];
    const LISTING_TYPES = [
      { id: 'free', label: 'Free' }, { id: 'swap', label: 'Swap' }, { id: 'cheap', label: 'Cheap' },
    ];
    const CATEGORY_LABEL = { clothes: 'Clothes', electronics: 'Electronics', furniture: 'Furniture', books: 'Books', kitchen: 'Kitchen' };
    const CONDITION_LABEL = { like_new: 'Like new', good: 'Good', worn: 'Worn' };
    const TYPE_LABEL = { free: 'Free', swap: 'Swap', cheap: 'Cheap' };
    const STATUS_LABEL = { available: 'Available', reserved: 'Reserved', done: 'Done' };
    const REQUEST_STATUS_LABEL = {
      pending: 'Pending', accepted: 'Accepted', declined: 'Declined',
      cancelled: 'Cancelled', completed: 'Completed',
    };
    const BADGE_NAMES = ['Loop starter', 'Loop maker', 'Loop champion', 'Loop legend'];

    // ── App state ──────────────────────────────────────────────────────────
    const state = {
      guest: false,
      profile: null,     // { username, pickup_area } — null for guests
      feedCategory: 'all',
      feedType: 'all',
      loopsTab: 'items',
      post: { photos: [], type: 'free' },
    };

    // A message that survives one navigation (an action succeeded/failed and
    // the screen was redrawn).
    let flash = null;

    let mePromise = null;
    function loadMe(force) {
      if (!mePromise || force) {
        mePromise = api('/api/me').then(d => {
          state.guest = !!d.guest;
          state.profile = d.profile || null;
        }).catch(() => { state.guest = true; state.profile = null; });
      }
      return mePromise;
    }

    // ── Formatting ─────────────────────────────────────────────────────────
    function fmt(n) { return Number(n).toLocaleString('en-US'); }
    function rupiah(n) { return 'Rp ' + Number(n).toLocaleString('id-ID'); }
    function kgFromG(g) {
      const kg = g / 1000;
      return (Math.round(kg * 10) / 10).toLocaleString('en-US');
    }
    function fmtDate(iso) {
      return new Date(iso).toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' });
    }
    function nowDate() {
      return (window.usernode && typeof window.usernode.now === 'function')
        ? window.usernode.now() : new Date();
    }
    function timeAgo(iso) {
      const s = Math.max(0, (nowDate().getTime() - new Date(iso).getTime()) / 1000);
      if (s < 90) return 'just now';
      const m = Math.floor(s / 60);
      if (m < 60) return m + (m === 1 ? ' minute ago' : ' minutes ago');
      const h = Math.floor(m / 60);
      if (h < 24) return h + (h === 1 ? ' hour ago' : ' hours ago');
      const d = Math.floor(h / 24);
      if (d < 30) return d + (d === 1 ? ' day ago' : ' days ago');
      return fmtDate(iso);
    }
    function zoneLabel(id) {
      const z = ZONES.find(x => x.id === id);
      return z ? z.label : (id || '');
    }
    // "RT 03 · ≈300 m", or just the area when the viewer has no area set.
    function distanceLabel(item) {
      const area = zoneLabel(item.pickup_area);
      if (item.distance_m === null || item.distance_m === undefined) return area;
      if (item.distance_m === 0) return area + ' · same area';
      if (item.distance_m < 1000) return area + ' · ≈' + item.distance_m + ' m';
      return area + ' · ≈' + (item.distance_m / 1000).toFixed(1) + ' km';
    }
    // The compact form on a feed card: just how far, since the full line
    // with the area wraps badly in a two-column tile.
    function shortDistance(item) {
      if (item.distance_m === null || item.distance_m === undefined) return zoneLabel(item.pickup_area);
      if (item.distance_m === 0) return 'same area';
      if (item.distance_m < 1000) return '≈' + item.distance_m + ' m';
      return '≈' + (item.distance_m / 1000).toFixed(1) + ' km';
    }
    function typeLabel(item) {
      if (item.listing_type === 'cheap' && item.price) return rupiah(item.price);
      return TYPE_LABEL[item.listing_type] || item.listing_type;
    }

    // ── Small components ───────────────────────────────────────────────────
    function badge(text) {
      return el('span', 'shrink-0 rounded-full bg-raised px-2 py-0.5 text-small text-muted', text);
    }
    function statusBadge(status) {
      return badge(STATUS_LABEL[status] || status);
    }
    function typePill(item) {
      return el('span', 'shrink-0 rounded-full px-3 py-1 text-small font-medium ' +
        (item.listing_type === 'free' ? 'bg-accent text-on-accent' : 'border border-line bg-surface text-fg'),
        typeLabel(item));
    }
    function banner(text, isError) {
      return el('div', 'rounded-lg border px-4 py-3 text-small ' +
        (isError ? 'border-danger/40 text-danger' : 'border-line bg-raised text-fg'), text);
    }
    function infoLine(text) {
      return el('p', 'rounded-lg border border-line bg-surface px-4 py-3 text-body', text);
    }
    function fieldRow(labelText, input) {
      const wrap = el('label', 'flex flex-col gap-1');
      wrap.append(el('span', 'px-1 text-small font-medium text-muted', labelText), input);
      return wrap;
    }
    function textField() { const i = el('input', 'field'); i.type = 'text'; return i; }
    function areaField() {
      const t = el('textarea', 'field min-h-24');
      return t;
    }
    function selectField(items, value, placeholder) {
      const s = el('select', 'field');
      if (placeholder) {
        const o = el('option', '', placeholder);
        o.value = '';
        s.append(o);
      }
      for (const it of items) {
        const o = el('option', '', it.label);
        o.value = it.id;
        s.append(o);
      }
      s.value = value || '';
      return s;
    }
    function primaryButton(label, onClick) {
      const b = el('button', 'btn-primary self-start', label);
      b.type = 'button';
      b.addEventListener('click', onClick);
      return b;
    }
    function secondaryButton(label, onClick) {
      const b = el('button', 'btn-secondary self-start', label);
      b.type = 'button';
      b.addEventListener('click', onClick);
      return b;
    }
    function postButton(label) {
      return primaryButton(label || 'Post an item', () => go('post'));
    }
    function browseButton() {
      return secondaryButton('Browse items', () => go('home'));
    }
    // A row of single-choice chips (feed filters, My Loops tabs, listing type).
    function chipRow(label, items, value, onPick) {
      const wrap = el('div', 'flex flex-col gap-1');
      if (label) wrap.append(el('span', 'px-1 text-small font-medium text-muted', label));
      const scroller = el('div', '-mx-4 flex gap-2 overflow-x-auto px-4');
      for (const it of items) {
        const b = el('button', 'chip shrink-0', it.label);
        b.type = 'button';
        b.setAttribute('aria-pressed', it.id === value ? 'true' : 'false');
        b.addEventListener('click', () => onPick(it.id));
        scroller.append(b);
      }
      wrap.append(scroller);
      return wrap;
    }
    function askAccount(action) {
      if (window.usernode && typeof window.usernode.askForAccount === 'function') {
        window.usernode.askForAccount({ action: action });
      }
    }
    function accountCard(action) {
      const card = el('div', 'card flex flex-col gap-3');
      card.append(
        el('p', 'text-heading', 'Make an account to continue'),
        el('p', 'text-body text-muted', 'ReLoop works with your Homeroom account. Sign in to ' + action + '.')
      );
      const b = el('button', 'btn-primary self-start', 'Make an account');
      b.type = 'button';
      b.addEventListener('click', () => askAccount(action));
      card.append(b);
      return card;
    }

    // ── The four states of anything that loads data ────────────────────────
    // Exactly one of loading / data / empty / error shows at a time. Empty
    // only when the load worked and found nothing; a failure is the error
    // state, never "nothing yet".
    function makeStates(host, opts) {
      opts = opts || {};
      const loading = el('div', 'list');
      loading.setAttribute('role', 'status');
      loading.append(el('span', 'sr-only', opts.loadingText || 'Loading'));
      for (const w of ['w-1/2', 'w-1/3', 'w-2/5']) {
        const r = el('div', 'list-row');
        r.append(el('div', 'skeleton h-4 ' + w));
        loading.append(r);
      }
      const listEl = el('ul', 'list');
      const emptyEl = el('div', 'state-empty');
      const errorEl = el('div', 'state-error');
      const retryBtn = el('button', 'btn-secondary', 'Retry');
      retryBtn.type = 'button';
      errorEl.append(
        icon(ICONS.alert, 'h-6 w-6 text-danger'),
        el('p', 'text-heading', opts.errorTitle || "Couldn't load this"),
        el('p', 'text-body text-muted', opts.errorBody || 'Check your connection and try again.'),
        retryBtn
      );
      const parts = [loading, listEl, emptyEl, errorEl];
      for (const p of parts) host.append(p);
      const api2 = {
        show(name) {
          for (const p of parts) p.hidden = true;
          ({ loading: loading, list: listEl, empty: emptyEl, error: errorEl })[name].hidden = false;
        },
        setEmpty(title, body, extraNode) {
          emptyEl.replaceChildren(
            el('p', 'text-heading', title),
            el('p', 'text-body text-muted', body)
          );
          if (extraNode) emptyEl.append(extraNode);
        },
        listEl: listEl,
        retry: null,
      };
      retryBtn.addEventListener('click', () => { api2.show('loading'); if (api2.retry) api2.retry(); });
      api2.show('loading');
      return api2;
    }

    // ── Photos ─────────────────────────────────────────────────────────────
    // An item's photo, or a category mark where there is none.
    function photoBox(item, imgCls) {
      if (item.photo_url) {
        const img = el('img', imgCls || 'h-full w-full object-cover');
        img.src = item.photo_url;
        img.alt = '';
        img.loading = 'lazy';
        return img;
      }
      const box = el('div', 'flex h-full w-full items-center justify-center bg-raised');
      box.append(icon(CATEGORY_ICON[item.category] || ICONS.books, 'h-10 w-10 text-muted'));
      return box;
    }

    // ── Router + tab bar ───────────────────────────────────────────────────
    const appRoot = document.getElementById('app');
    const tabbar = document.getElementById('tabbar');
    const TABS = [
      { id: 'home', label: 'Home', icon: ICONS.home },
      { id: 'post', label: 'Post', icon: ICONS.post },
      { id: 'loops', label: 'Loops', icon: ICONS.loops },
      { id: 'impact', label: 'Impact', icon: ICONS.impact },
      { id: 'profile', label: 'Profile', icon: ICONS.profile },
    ];
    const routes = {};

    // `#/item/12` is the one route with a parameter; everything else is a
    // plain screen name.
    function parseRoute() {
      const h = window.location.hash.replace(/^#\/?/, '');
      const m = /^item\/(\d+)$/.exec(h);
      if (m) return { name: 'item', id: parseInt(m[1], 10) };
      return { name: routes[h] ? h : 'home' };
    }

    function renderTabbar(current) {
      const active = current === 'item' ? 'home' : current;
      tabbar.replaceChildren(...TABS.map(t => {
        const b = el('button', 'tab-btn');
        b.type = 'button';
        if (t.id === active) b.setAttribute('aria-current', 'page');
        b.append(icon(t.icon, 'h-5 w-5'), el('span', '', t.label));
        b.addEventListener('click', () => go(t.id));
        return b;
      }));
    }

    let routeEpoch = 0;
    async function route() {
      const r = parseRoute();
      renderTabbar(r.name);
      const epoch = ++routeEpoch;
      const node = await Promise.resolve(routes[r.name](r));
      if (epoch !== routeEpoch) return;
      if (flash) {
        node.prepend(banner(flash.text, flash.error));
        flash = null;
      }
      appRoot.replaceChildren(node);
      window.scrollTo(0, 0);
    }
    window.addEventListener('hashchange', route);

    function go(name, id) {
      const target = '#/' + name + (id ? '/' + id : '');
      if (window.location.hash === target) route();
      else window.location.hash = target;
    }

    // A successful action redraws the screen and says what happened.
    function done(text) {
      flash = { text: text };
      route();
    }
    function failed(text) {
      flash = { text: text, error: true };
      route();
    }

    // ── Home: the feed ─────────────────────────────────────────────────────
    function itemCard(item) {
      const li = el('li');
      const b = el('button', 'card flex w-full flex-col overflow-hidden p-0 text-left');
      b.type = 'button';
      b.addEventListener('click', () => go('item', item.id));

      const media = el('div', 'relative aspect-square w-full overflow-hidden');
      media.append(photoBox(item, 'h-full w-full object-cover'));
      media.append(el('span', 'absolute left-2 top-2 rounded-full px-2 py-0.5 text-small font-medium ' +
        (item.listing_type === 'free' ? 'bg-accent text-on-accent' : 'border border-line bg-surface text-fg'),
        typeLabel(item)));
      if (item.is_mine) {
        media.append(el('span', 'absolute right-2 top-2 rounded-full bg-surface px-2 py-0.5 text-small text-muted', 'Yours'));
      }

      const body = el('div', 'flex flex-col gap-1 p-3');
      body.append(
        el('p', 'line-clamp-2 text-body font-medium', item.title),

    function actionsNode(item) {
      const box = el('div', 'flex flex-col gap-3');
      if (state.guest) {
        box.append(primaryButton('Request this item', () => askAccount('request this item')));
        return box;
      }
      if (item.is_mine) {
        if (item.status === 'available') {
          box.append(el('p', 'px-1 text-small text-muted', 'Mark it done once it has changed hands. It then counts in your Impact.'));
          box.append(secondaryButton('Mark as done', () => completeItem(item)));
        } else if (item.status === 'reserved') {
          box.append(infoLine('Reserved for @' + (item.reserved_username || 'a neighbor') + '.'));
          const row = el('div', 'flex flex-wrap gap-2');
          row.append(
            primaryButton('Mark as done', () => completeItem(item)),
            secondaryButton('Mark available again', () => releaseItem(item))
          );
          box.append(row);
        } else {
          box.append(infoLine('This loop is complete. It counts in your Impact.'));
        }
        if (item.requests && item.requests.length) {
          box.append(ownerRequests(item));
        } else if (item.status === 'available') {
          box.append(el('p', 'px-1 text-small text-muted', 'No requests yet. Neighbors can ask for it from their feed.'));
        }
        return box;
      }

      const mine = item.my_request;
      if (item.status === 'available') {
        if (mine && mine.status === 'pending') {
          box.append(infoLine('Request sent. The owner will answer soon.'));
          box.append(secondaryButton('Cancel request', () => cancelRequest(mine)));
        } else {
          if (mine && (mine.status === 'declined' || mine.status === 'cancelled')) {
            box.append(infoLine('Your earlier request was ' +
              (REQUEST_STATUS_LABEL[mine.status] || 'closed').toLowerCase() + '. You can ask again.'));
          }
          const b = primaryButton('Request this item', () => openRequestForm(item, box));
          box.append(b);
        }
      } else if (item.status === 'reserved') {
        if (mine && mine.status === 'accepted') {
          box.append(infoLine('Reserved for you. Arrange the pickup with @' + item.owner_username + '.'));
        } else {
          box.append(infoLine('This item is reserved for someone else.'));

        box.append(infoLine('This item has found a new home.'));
      }

    }

    // ── Post an item ───────────────────────────────────────────────────────
    function photoPicker() {
      const wrap = el('div', 'flex flex-col gap-1');
      wrap.append(el('span', 'px-1 text-small font-medium text-muted', 'Photos (up to 3)'));
      const row = el('div', 'flex flex-wrap gap-2');
      const statusLine = el('p', 'px-1 text-small text-muted', '');
      const canUpload = !!(window.usernode && typeof window.usernode.uploadFile === 'function');
      if (!canUpload) {
        statusLine.textContent = 'Adding photos is not available here. You can still post without them.';
      }

      function draw() {
        row.replaceChildren();
        state.post.photos.forEach((url, idx) => {
          const box = el('div', 'relative h-24 w-24 shrink-0 overflow-hidden rounded-lg border border-line bg-raised');
          const img = el('img', 'h-full w-full object-cover');
          img.src = url;
          img.alt = '';
          const rm = el('button', 'absolute right-0 top-0 flex h-11 w-11 items-center justify-center rounded-full bg-surface/90 text-fg', '✕');
          rm.type = 'button';
          rm.setAttribute('aria-label', 'Remove photo ' + (idx + 1));
          rm.addEventListener('click', () => { state.post.photos.splice(idx, 1); draw(); });
          box.append(img, rm);
          row.append(box);
        });
        if (canUpload && state.post.photos.length < 3) {
          const slot = el('button', 'flex h-24 w-24 shrink-0 flex-col items-center justify-center gap-1 rounded-lg border border-dashed border-line text-small text-muted');
          slot.type = 'button';
          slot.setAttribute('aria-label', 'Add a photo');
          slot.append(icon(ICONS.camera, 'h-6 w-6'), el('span', '', 'Add photo'));
          const input = el('input');
          input.type = 'file';
          input.accept = 'image/*';
          input.hidden = true;
          input.addEventListener('change', async () => {
            const file = input.files && input.files[0];
            input.value = '';
            if (!file) return;
            if (!/^image\//.test(file.type)) {
              statusLine.textContent = 'Photos must be images.';
              return;
            }
            if (file.size > 5 * 1024 * 1024) {
              statusLine.textContent = 'That photo is over 5 MB. Pick a smaller one.';
              return;
            }
            statusLine.textContent = 'Uploading…';
            slot.disabled = true;
            try {
              const stored = await window.usernode.uploadFile(file, { visibility: 'public' });
              state.post.photos.push(stored.url);
              statusLine.textContent = '';
              draw();
            } catch (_) {
              statusLine.textContent = "That photo couldn't be uploaded. Try another one.";
              slot.disabled = false;
            }
          });
          slot.addEventListener('click', () => input.click());
          row.append(slot, input);
        }
        if (state.post.photos.length >= 3) statusLine.textContent = 'That is all three photos.';
      }
      draw();
      wrap.append(row, statusLine);
      return { node: wrap, list: () => state.post.photos.slice() };
    }

    routes.post = async function postView() {
      const root = el('section', 'flex flex-col gap-4');
      root.append(el('h1', 'text-title', 'Post an item'));
      await loadMe(true);
      if (state.guest) {
        root.append(accountCard('post an item'));
        return root;
      }

      const note = el('div');
      const form = el('form', 'flex flex-col gap-4');
      const photos = photoPicker();

      const titleIn = textField();
      titleIn.maxLength = 120;
      titleIn.placeholder = 'What are you passing on?';

      const descIn = areaField();
      descIn.maxLength = 600;
      descIn.placeholder = 'A sentence or two about the item';

      const condSel = selectField(CONDITIONS, 'good');
      const catSel = selectField(CATEGORIES, null, 'Choose a category');
      const areaSel = selectField(ZONES, state.profile && state.profile.pickup_area, 'Choose a pickup area');

      const typeRow = el('div', 'flex gap-2');
      const priceIn = el('input', 'field');
      priceIn.type = 'number';
      priceIn.min = '1';
      // Step 1, not 1000: with min="1" a step of 1000 makes almost every
      // price fail the browser's own validation, and the form then never
      // submits at all.
      priceIn.step = '1';
      priceIn.placeholder = 'Price in rupiah, for example 75000';
      const priceWrap = fieldRow('Price (Rp)', priceIn);
      function drawTypes() {
        typeRow.replaceChildren(...LISTING_TYPES.map(t => {
          const b = el('button', 'chip flex-1', t.label);
          b.type = 'button';
          b.setAttribute('aria-pressed', state.post.type === t.id ? 'true' : 'false');
          b.addEventListener('click', () => { state.post.type = t.id; drawTypes(); });
          return b;
        }));
        priceWrap.hidden = state.post.type !== 'cheap';
      }
      drawTypes();
      const typeBlock = el('div', 'flex flex-col gap-1');
      typeBlock.append(el('span', 'px-1 text-small font-medium text-muted', 'Offered as'), typeRow);

      const submit = el('button', 'btn-primary', 'Post item');
      submit.type = 'submit';

      form.append(
        photos.node,
        fieldRow('Title', titleIn),
        fieldRow('Description', descIn),
        fieldRow('Condition', condSel),
        fieldRow('Category', catSel),
        fieldRow('Pickup area', areaSel),
        typeBlock,
        priceWrap,
        submit
      );
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const title = titleIn.value.trim();
        if (!title) { note.replaceChildren(banner('Give the item a title.', true)); titleIn.focus(); return; }
        if (!catSel.value) { note.replaceChildren(banner('Choose a category.', true)); return; }
        if (!areaSel.value) { note.replaceChildren(banner('Choose a pickup area.', true)); return; }
        if (state.post.type === 'cheap' && !(parseInt(priceIn.value, 10) > 0)) {
          note.replaceChildren(banner('Enter a price in rupiah.', true));
          priceIn.focus();
          return;
        }
        submit.disabled = true;
        try {
          const d = await api('/api/items', {
            method: 'POST',
            body: JSON.stringify({
              title: title,
              description: descIn.value,
              condition: condSel.value,
              category: catSel.value,
              pickup_area: areaSel.value,
              listing_type: state.post.type,
              price: state.post.type === 'cheap' ? parseInt(priceIn.value, 10) : null,
              photos: photos.list(),
            }),
          });
          state.post = { photos: [], type: 'free' };
          flash = { text: 'Posted. Neighbors can see it now.' };
          window.location.hash = '#/item/' + d.id;
        } catch (e2) {
          note.replaceChildren(banner(
            e2.code === 'invalid_photo' ? 'One photo could not be saved. Remove it and try again.'
              : e2.code === 'invalid_price' ? 'Enter a price in rupiah.'
                : 'Posting failed. Try again.', true));
          submit.disabled = false;
        }
      });

      root.append(note, form);
      return root;
    };

    routes.impact = async function impactView() {
      const root = el('section', 'flex flex-col gap-4');
      root.append(el('h1', 'text-title', 'Impact'));
      await loadMe(true);
      if (state.guest) {
        root.append(accountCard('see your impact'));
        return root;
      }

      const host = el('div');
      root.append(host);
      const st = makeStates(host, {
        errorTitle: "Couldn't load your impact",
        errorBody: 'Check your connection and try again.',
        loadingText: 'Loading your impact',
      });
      st.retry = load;
      async function load() {
        st.show('loading');
        try {
          const i = (await api('/api/impact')).impact;
          // Summary, not a row list: the host gives up its .list chrome and
          // carries tiles and the badge card instead.
          st.listEl.className = 'flex flex-col gap-4';

          const tiles = el('div', 'flex flex-wrap gap-2');
          function tile(label, value) {
            const c = el('div', 'card flex min-w-[45%] flex-1 flex-col gap-1');
            c.append(el('p', 'text-small text-muted', label),
              el('p', 'text-title tabular-nums', value));
            return c;
          }
          tiles.append(
            tile('Items reused', fmt(i.loops)),
            tile('Waste avoided', kgFromG(i.weight_g) + ' kg')
          );

          const level = Math.floor(i.loops / 5);
          const into = i.loops % 5;
          const toNext = 5 - into;
          const badgeCard = el('div', 'card flex flex-col gap-2');
          if (level > 0) {
            const name = BADGE_NAMES[Math.min(level, BADGE_NAMES.length) - 1];
            badgeCard.append(
              el('p', 'text-small text-muted', 'Your badge'),
              el('p', 'text-heading', name),
              el('p', 'text-small text-muted',
                into + ' of 5 loops to the next badge. ' + toNext + (toNext === 1 ? ' loop' : ' loops') + ' to go.')
            );
          } else {
            badgeCard.append(
              el('p', 'text-heading', 'Your first badge is close'),
              el('p', 'text-small text-muted',
                into + ' of 5 loops. Every 5 completed loops earns a badge.')
            );
          }
          const bar = el('div', 'h-2 overflow-hidden rounded-full bg-raised');
          const fill = el('div', 'h-full rounded-full bg-accent');
          fill.style.width = (into / 5 * 100) + '%';
          bar.append(fill);
          badgeCard.append(bar);

          const nodes = [tiles, badgeCard];
          if (i.loops === 0) {
            const empty = el('div', 'state-empty');
            empty.append(
              el('p', 'text-heading', 'No loops completed yet'),
              el('p', 'text-body text-muted',
                'When an item you posted or received is marked done, it counts here.'),
              postButton()
            );
            nodes.push(empty);
          } else {
            nodes.push(el('p', 'px-1 text-small text-muted',
              'Waste avoided is estimated from the category of each item that found a new home.'));
          }

          st.listEl.replaceChildren(...nodes);
          st.show('list');
        } catch (e) { console.error(String(e && e.stack || e)); st.show('error'); }
      }
      await load();
      return root;
    };

    // ── Profile ────────────────────────────────────────────────────────────
    routes.profile = async function profileView() {
      const root = el('section', 'flex flex-col gap-4');
      root.append(el('h1', 'text-title', 'Profile'));
      await loadMe(true);
      if (state.guest) {
        root.append(accountCard('set your pickup area'));
        return root;
      }

      const card = el('div', 'card flex flex-col gap-1');
      card.append(
        el('p', 'text-small text-muted', 'Signed in as'),
        el('p', 'text-heading', '@' + (state.profile ? state.profile.username : ''))
      );
      root.append(card);

      const note = el('div');
      const form = el('form', 'flex flex-col gap-3');
      const areaSel = selectField(ZONES, state.profile && state.profile.pickup_area, 'No area set');
      form.append(
        fieldRow('Pickup area', areaSel),
        el('p', 'px-1 text-small text-muted',
          'Where a pickup would happen. The feed uses it to show how far each item is, and your posts show the area.')
      );
      const save = el('button', 'btn-primary self-start', 'Save');
      save.type = 'submit';
      form.append(save);
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        save.disabled = true;
        try {
          const d = await api('/api/me', {
            method: 'PATCH',
            body: JSON.stringify({ pickup_area: areaSel.value }),
          });
          state.profile = d.profile;
          note.replaceChildren(banner('Saved.'));
        } catch (_) {
          note.replaceChildren(banner('Saving failed. Try again.', true));
        } finally { save.disabled = false; }
      });
      root.append(note, form);
      return root;
    };

    // ── Boot ───────────────────────────────────────────────────────────────
    // Views await loadMe() themselves; once it lands, refresh the tab bar.
    const firstRoute = route();
    loadMe().then(() => renderTabbar(parseRoute().name));
    if (window.usernode && typeof window.usernode.ready === 'function') {
      window.usernode.ready(firstRoute);
    }
  })();
  </script>
</body>
</html>
